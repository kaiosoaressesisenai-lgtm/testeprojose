<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Mundo Gira ao Seu Redor?</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101018;
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: #1c1c29;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 40px #0005;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
    line-height: 1.5;
}

.progress {
    background: #333;
    height: 8px;
    border-radius: 10px;
    margin-bottom: 30px;
    overflow: hidden;
}

.progress-bar {
    background: #a855f7;
    height: 100%;
    width: 0%;
    transition: .3s;
}

.question {
    margin-bottom: 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid #333;
}

.question h3 {
    font-size: 17px;
    margin-bottom: 15px;
    line-height: 1.5;
}

label {
    display: block;
    background: #292938;
    padding: 13px;
    margin: 8px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
}

label:hover {
    background: #39304b;
}

input {
    margin-right: 10px;
    accent-color: #a855f7;
}

button {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 8px;
    background: #9333ea;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #7e22ce;
}

#result {
    display: none;
    text-align: center;
    margin-top: 30px;
    padding: 25px;
    background: #292938;
    border-radius: 12px;
}

#result h2 {
    color: #c084fc;
    margin-bottom: 15px;
}

#result p {
    line-height: 1.7;
    color: #ddd;
}

.score {
    font-size: 38px;
    font-weight: bold;
    color: #c084fc;
    margin: 15px 0;
}

</style>
</head>
<body>

<div class="container">

<h1>O mundo gira ao seu redor?</h1>

<p class="subtitle">
20 perguntas para descobrir se você costuma colocar suas vontades,
opiniões e sentimentos acima dos outros.
</p>

<div class="progress">
<div class="progress-bar" id="progress"></div>
</div>

<form id="quiz">

<div id="questions"></div>

<button type="submit">Descobrir meu resultado</button>

</form>

<div id="result">
<h2 id="resultTitle"></h2>
<div class="score" id="score"></div>
<p id="resultText"></p>
<br>
<button onclick="location.reload()">Refazer teste</button>
</div>

</div>

<script>
const questions = [
"Quando alguém não concorda com sua opinião, você sente que essa pessoa está sendo injusta com você?",
"Você costuma esperar que as pessoas percebam quando você está chateado, mesmo sem explicar o motivo?",
"Quando um amigo cancela um compromisso com você, sua primeira reação é pensar que ele não se importa com você?",
"Você fica incomodado quando uma conversa não é sobre você?",
"Quando alguém recebe mais atenção que você, sente necessidade de recuperar o destaque?",
"Você acredita que as pessoas deveriam considerar seus sentimentos antes de tomar decisões?",
"Quando alguém não responde sua mensagem rapidamente, você pensa que está sendo ignorado de propósito?",
"Você costuma achar que suas necessidades são mais urgentes que as dos outros?",
"Quando alguém faz uma crítica construtiva, você sente que está sendo atacado?",
"Você espera que as pessoas entendam seus problemas mesmo quando não demonstra o que está sentindo?",
"Quando um grupo escolhe fazer algo diferente do que você queria, fica irritado?",
"Você costuma interromper alguém porque acredita que tem algo mais importante para dizer?",
"Quando alguém conquista algo importante, você acaba comparando a conquista com as suas?",
"Você acredita que as pessoas deveriam mudar seus planos para atender às suas necessidades?",
"Quando alguém discorda de você, tem dificuldade em aceitar que ela também pode estar certa?",
"Você sente que recebe menos atenção do que merece?",
"Quando alguém está passando por um problema, você consegue deixar seus próprios problemas de lado para ouvir?",
"Você costuma se desculpar quando percebe que exagerou em alguma situação?",
"Você consegue aceitar que nem sempre será a prioridade das pessoas?",
"Você acredita que as relações devem funcionar com consideração e esforço dos dois lados?"
];

const alternatives = [
{ text: "Nunca", value: 0 },
{ text: "Raramente", value: 1 },
{ text: "Às vezes", value: 2 },
{ text: "Frequentemente", value: 3 },
{ text: "Sempre", value: 4 }
];

const container = document.getElementById("questions");

questions.forEach((question, index) => {
    const div = document.createElement("div");
    div.className = "question";

    let html = `<h3>${index + 1}. ${question}</h3>`;

    alternatives.forEach(option => {
        html += `
        <label>
            <input type="radio" name="q${index}" value="${option.value}" required>
            ${option.text}
        </label>`;
    });

    div.innerHTML = html;
    container.appendChild(div);
});

document.querySelectorAll("input").forEach(input => {
    input.addEventListener("change", () => {
        const answered = document.querySelectorAll('input:checked').length;
        document.getElementById("progress").style.width = (answered / 20 * 100) + "%";
    });
});

document.getElementById("quiz").addEventListener("submit", function(e) {
    e.preventDefault();

    let score = 0;

    questions.forEach((_, index) => {
        score += Number(document.querySelector(`input[name="q${index}"]:checked`).value);
    });

    let title;
    let text;

    if (score <= 20) {
        title = "Você demonstra bastante consideração!";
        text = "Suas respostas indicam que você costuma respeitar o espaço, as opiniões e os sentimentos dos outros. Parece entender que nem tudo precisa girar em torno de você.";
    } else if (score <= 40) {
        title = "Um pouco de atenção não faz mal";
        text = "Você apresenta algumas atitudes centradas nas próprias necessidades, mas isso não significa que seja uma pessoa egocêntrica. Vale refletir sobre algumas situações.";
    } else if (score <= 60) {
        title = "Sinal de alerta!";
        text = "Suas respostas indicam que você pode ter dificuldade em considerar perspectivas diferentes das suas. Talvez seja interessante observar como suas atitudes afetam as pessoas ao seu redor.";
    } else {
        title = "O protagonista de tudo?";
        text = "Suas respostas indicam uma tendência elevada a colocar suas próprias necessidades e expectativas no centro das situações. Vale refletir sobre empatia, reciprocidade e respeito.";
    }

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("score").textContent = score + "/80";
    document.getElementById("resultText").textContent = text;

    window.scrollTo({top: 0, behavior: "smooth"});
});
</script>

</body>
</html>
